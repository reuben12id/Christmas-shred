<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Christmas 78kg Blueprint" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#30d158" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="190" cy="170" r="190" fill="url(#glow)"/>

  <!-- app icon -->
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c21"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="lgl" cx="512" cy="512" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30d158" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="larc" x1="0" y1="152" x2="0" y2="872" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8cff9e"/>
      <stop offset="1" stop-color="#1fb84a"/>
    </linearGradient>
  </defs>
  <clipPath id="ic"><rect x="90" y="80" width="180" height="180" rx="40"/></clipPath>
  <g clip-path="url(#ic)"><g transform="translate(90 80) scale(0.17578)"><rect width="1024" height="1024" fill="url(#lbg)"/>
  <rect width="1024" height="1024" fill="url(#lgl)"/>
  <!-- progress ring: track, then 270 degrees of progress -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#26272b" stroke-width="72"/>
  <path d="M512 152A360 360 0 1 1 152 512" fill="none" stroke="url(#larc)" stroke-width="72" stroke-linecap="round"/>
  <!-- geometric 78 -->
  <g transform="translate(516 512)" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-140 -115H-30L-92 115"/>
    <circle cx="75" cy="-65" r="50"/>
    <circle cx="75" cy="57" r="58"/>
  </g>
</g></g>
  <rect x="90" y="80" width="180" height="180" rx="40" fill="none" stroke="#2c2c2e" stroke-width="2"/>

  <!-- title -->
  <text x="330" y="160" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Christmas 78kg Blueprint</text>
  <text x="332" y="203" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="25" fill="#8e8e93">11-week strength and recomposition tracker for iPhone</text>

  <!-- tab pills -->
  <g font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="332" y="236" width="104" height="40" rx="20" fill="#0a84ff"/>
    <text x="384" y="263" fill="#ffffff">Train</text>
    <rect x="448" y="236" width="96" height="40" rx="20" fill="#1c1c1e"/>
    <text x="496" y="263" fill="#8e8e93">Fuel</text>
    <rect x="556" y="236" width="96" height="40" rx="20" fill="#1c1c1e"/>
    <text x="604" y="263" fill="#8e8e93">Body</text>
    <rect x="664" y="236" width="108" height="40" rx="20" fill="#1c1c1e"/>
    <text x="718" y="263" fill="#8e8e93">Export</text>
  </g>
</svg>
